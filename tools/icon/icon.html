<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .plate {
    width: 1024px; height: 1024px; border-radius: 228px;
    background: linear-gradient(160deg, #ffffff 0%, #f3f4f8 55%, #e8eaf0 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  /* 精灵球本体，全部用 CSS 画，矢量清晰 */
  .ball {
    width: 660px; height: 660px; border-radius: 50%;
    position: relative; overflow: hidden;
    border: 30px solid #1c1c1e;
    box-shadow: 0 18px 40px rgba(20, 20, 30, .22);
    background: #fff;
  }
  .top {
    position: absolute; inset: 0 0 50% 0;
    background: linear-gradient(170deg, #ff5a5a 0%, #e63946 55%, #c81f2c 100%);
  }
  .band {
    position: absolute; left: -30px; right: -30px; top: 50%;
    height: 44px; transform: translateY(-50%);
    background: #1c1c1e;
  }
  .hub {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 186px; height: 186px; border-radius: 50%;
    background: #1c1c1e;
    display: flex; align-items: center; justify-content: center;
  }
  .hub i {
    display: block; width: 118px; height: 118px; border-radius: 50%;
    background: radial-gradient(circle at 36% 32%, #ffffff 0%, #eef0f4 62%, #d6d9e0 100%);
    box-shadow: inset 0 -6px 12px rgba(0, 0, 0, .18);
  }
  .shine {
    position: absolute; left: 58px; top: 34px; width: 210px; height: 116px;
    border-radius: 50%; background: rgba(255, 255, 255, .38);
    transform: rotate(-24deg); filter: blur(6px);
  }
</style>
</head>
<body>
  <div class="plate">
    <div class="ball">
      <div class="top"><div class="shine"></div></div>
      <div class="band"></div>
      <div class="hub"><i></i></div>
    </div>
  </div>
</body>
</html>
