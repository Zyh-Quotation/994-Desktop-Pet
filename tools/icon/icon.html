<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; width: 1024px; height: 1024px;
    background: transparent; overflow: hidden;
  }
  .plate {
    width: 1024px; height: 1024px; border-radius: 228px;
    background:
      radial-gradient(circle at 32% 26%, #fff6d8 0%, #ffe08a 42%, #ffb347 72%, #ff8f3c 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 46%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 58%);
  }
  img {
    position: relative; width: 660px; height: 660px;
    image-rendering: pixelated;
    filter: drop-shadow(0 26px 34px rgba(150, 90, 0, .30));
    transform: translateY(6px);
  }
</style>
</head>
<body>
  <div class="plate">
    <div class="glow"></div>
    <img src="../../assets/pokemon/25.gif" alt="">
  </div>
</body>
</html>
