<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>孵蛋</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 22px 18px;
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 28%, #fffdf3 0%, #f6f7fb 62%);
    color: #1c1c1e;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { margin: 0 0 2px; font-size: 18px; }
  .sub { margin: 0 0 18px; font-size: 11.5px; color: #8e8e93; }

  .ring {
    --p: 0%;
    width: 168px; height: 168px; border-radius: 50%;
    background: conic-gradient(#ffb347 var(--p), #eceef3 0);
    display: flex; align-items: center; justify-content: center;
    position: relative; transition: background .4s;
  }
  .ring::after {
    content: ''; position: absolute; inset: 9px; border-radius: 50%; background: #fff;
  }
  .egg {
    position: relative; z-index: 2; font-size: 74px; line-height: 1;
    animation: wob 2.4s ease-in-out infinite;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .12));
  }
  @keyframes wob {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }
  .ring.ready { background: conic-gradient(#34c759 100%, #34c759 0); }
  .ring.ready .egg { animation: wob .8s ease-in-out infinite; }

  .timer { margin: 16px 0 2px; font-size: 27px; font-weight: 600; letter-spacing: -.6px; }
  .timer small { font-size: 12px; font-weight: 400; color: #8e8e93; margin-left: 3px; }
  .stat { margin: 0 0 14px; font-size: 11.5px; color: #8e8e93; }

  button {
    border: 0; border-radius: 10px; padding: 11px 22px; font: inherit; font-size: 13px;
    background: #e63b3b; color: #fff; cursor: pointer; width: 100%; max-width: 280px;
  }
  button:disabled { background: #eceef3; color: #a1a1a6; cursor: default; }
  button.ghost { background: #f0f0f4; color: #3a3a3c; margin-top: 8px; }

  .log { margin-top: 14px; font-size: 11px; color: #a1a1a6; text-align: center; }

  /* ── 深色模式 ── */
  @media (prefers-color-scheme: dark) {
    body {
      background: radial-gradient(circle at 50% 28%, #2a2a2c 0%, #1c1c1e 62%) !important;
      color: #f5f5f7 !important;
    }
    .sub, .stat, .timer small, .log, small { color: #98989d !important; }
    .ring { background: conic-gradient(#ffb347 var(--p), #3a3a3c 0) !important; }
    .ring.ready { background: conic-gradient(#34c759 100%, #34c759 0) !important; }
    .ring::after { background: #1c1c1e !important; }
    button { background: #2c2c2e !important; color: #f5f5f7 !important; border-color: rgba(255,255,255,.12) !important; }
    button:disabled { background: #2c2c2e !important; color: #6e6e73 !important; }
    button.ghost { background: #2c2c2e !important; color: #d1d1d6 !important; }
  }
  .rarity { min-height: 18px; margin: 2px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .5px; }
  .rarity.common { color: var(--muted, #86868b); }
  .rarity.rare { color: #0a84ff; }
  .rarity.legendary { color: #c99700; }
  .rarity.shiny { color: #ff3b7f; }
  .egg.rare { filter: drop-shadow(0 0 12px rgba(90,200,250,.8)); }
  .egg.legendary { filter: drop-shadow(0 0 16px rgba(255,200,60,.95)); }
  .egg.shiny { filter: drop-shadow(0 0 16px rgba(255,80,150,.9)) saturate(1.3); }
</style>
  <script src="i18n-extra.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="skins.css">
</head>
<body>
  <h1>孵蛋</h1>
  <p class="sub" id="sub">它走着走着就会捡到一颗</p>

  <div class="ring" id="ring">
    <div class="egg" id="egg">🥚</div>
  </div>

  <div class="timer" id="timer">–</div>
  <p class="rarity" id="rarity"></p>
  <p class="stat" id="stat">–</p>

  <button id="hatch" disabled>还没有蛋</button>
  <button class="ghost" id="close">关闭</button>

  <p class="log" id="log">已经孵出 0 只</p>

  <script src="egg.js"></script>
</body>
</html>
