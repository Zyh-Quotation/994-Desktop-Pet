<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>陪伴报告</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 22px 24px 18px;
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #fff 0%, #f6f7fb 100%); color: #1c1c1e;
    display: flex; flex-direction: column;
  }
  h1 { margin: 0; font-size: 19px; letter-spacing: .5px; }
  .sub { margin: 4px 0 16px; font-size: 11.5px; color: #8e8e93; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; flex: 1; align-content: start; }
  .cell {
    background: #fff; border: 1px solid #ececf0; border-radius: 12px;
    padding: 11px 13px; display: flex; flex-direction: column; gap: 2px;
  }
  .cell .k { font-size: 11px; color: #8e8e93; }
  .cell .v { font-size: 19px; font-weight: 600; letter-spacing: -.3px; }
  .cell .v small { font-size: 11px; font-weight: 400; color: #8e8e93; margin-left: 2px; }
  .cell.wide { grid-column: span 2; }
  .bar { height: 5px; background: #f0f0f4; border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff6b6b, #ff9f43); border-radius: 3px; }
  footer { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .hint { font-size: 11px; color: #a1a1a6; }
  button {
    border: 0; border-radius: 9px; padding: 8px 18px; font: inherit; font-size: 12.5px;
    background: #e63b3b; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  button.ghost { background: #f0f0f4; color: #3a3a3c; }

  /* ── 深色模式 ── */
  @media (prefers-color-scheme: dark) {
    body {
      background: linear-gradient(160deg, #1c1c1e 0%, #141416 100%) !important;
      color: #f5f5f7 !important;
    }
    .cell {
      background: #1f1f22 !important;
      border-color: rgba(255, 255, 255, .08) !important;
    }
    .cell .k, .sub, .hint, small { color: #98989d !important; }
    .cell .v { color: #f5f5f7 !important; }
    .bar { background: rgba(255, 255, 255, .1) !important; }
    button.ghost { background: #2c2c2e !important; color: #f5f5f7 !important; }
  }
</style>
  <script src="i18n-extra.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="skins.css">
</head>
<body>
  <h1>陪伴报告</h1>
  <p class="sub" id="sub">–</p>

  <div class="grid">
    <div class="cell wide">
      <span class="k">已经陪你</span>
      <span class="v" id="days">–</span>
      <span class="bar"><i id="yearbar" style="width:0"></i></span>
    </div>
    <div class="cell"><span class="k">累计在线</span><span class="v"><span id="hours">0</span><small>小时</small></span></div>
    <div class="cell"><span class="k">走过</span><span class="v"><span id="meters">0</span><small>米</small></span></div>
    <div class="cell"><span class="k">喂食</span><span class="v" id="feed">0</span></div>
    <div class="cell"><span class="k">玩耍</span><span class="v" id="play">0</span></div>
    <div class="cell"><span class="k">摸头</span><span class="v" id="pet">0</span></div>
    <div class="cell"><span class="k">扔出去</span><span class="v" id="thrown">0</span></div>
    <div class="cell"><span class="k">专属招式</span><span class="v" id="sig">0</span></div>
    <div class="cell"><span class="k">遇见</span><span class="v" id="met">0</span></div>
    <div class="cell"><span class="k">异色</span><span class="v" id="shiny">0</span></div>
    <div class="cell"><span class="k">孵出</span><span class="v" id="hatch">0</span></div>
    <div class="cell"><span class="k">连续陪伴</span><span class="v"><span id="streak">1</span><small>天</small></span></div>
  </div>

  <footer>
    <span class="hint" id="hint">数据都存在你的电脑上</span>
    <button id="save" class="ghost">保存成图片</button>
  </footer>

  <script src="report.js"></script>
<script src="theme-boot.js"></script>
</body>
</html>
