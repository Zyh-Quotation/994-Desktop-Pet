<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>成就</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 20px 22px;
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(165deg, #fffdf7 0%, #f7f8fc 100%); color: #1c1c1e;
  }
  h1 { margin: 0 0 4px; font-size: 19px; }
  .sub { margin: 0 0 12px; font-size: 11.5px; color: #8e8e93; }
  .bar { height: 6px; background: #eef0f4; border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #ffb347, #ff6b6b); transition: width .5s; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ach {
    background: #fff; border: 1px solid #ececf0; border-radius: 14px;
    padding: 13px 10px 11px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    position: relative;
  }
  .ach.locked { background: #fbfbfd; border-color: #f0f0f4; }
  .badge {
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 25px; line-height: 1;
    background: linear-gradient(145deg, #ffe9a8, #ffb347);
    box-shadow: 0 3px 8px rgba(255, 159, 67, .28), inset 0 -2px 5px rgba(180, 110, 0, .18);
  }
  .ach.locked .badge {
    background: #f1f2f6;
    box-shadow: none;
    filter: grayscale(1);
    opacity: .55;
  }
  .ach .n { font-size: 12px; font-weight: 600; }
  .ach.locked .n { color: #a1a1a6; font-weight: 500; }
  .ach .d { font-size: 10.5px; color: #a1a1a6; line-height: 1.35; }
  .ach .tick {
    position: absolute; top: 7px; right: 8px; font-size: 10px; color: #34c759;
  }
  .ach.locked .tick { color: #d1d1d6; }
  footer { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; }
  .hint { font-size: 11px; color: #a1a1a6; }
  button { border: 0; border-radius: 9px; padding: 8px 18px; font: inherit; font-size: 12.5px; background: #f0f0f4; color: #3a3a3c; cursor: pointer; }
</style>
</head>
<body>
  <h1>成就</h1>
  <p class="sub" id="sub">–</p>
  <div class="bar"><i id="bar" style="width:0"></i></div>
  <div class="grid" id="grid"></div>
  <footer>
    <span class="hint">解锁时会冒出来并叫一声</span>
    <button id="close">关闭</button>
  </footer>
  <script src="achievements.js"></script>
</body>
</html>
