<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; cursor: default;
  }
  #card {
    box-sizing: border-box; height: 100%; padding: 20px 22px 18px;
    border-radius: 18px;
    background: rgba(255, 255, 255, .97);
    border: 1px solid rgba(0, 0, 0, .07);
    box-shadow: 0 14px 40px rgba(0, 0, 0, .18);
    backdrop-filter: blur(20px);
    display: flex; flex-direction: column;
    animation: pop .22s ease-out;
  }
  @keyframes pop {
    from { transform: scale(.94); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .star { font-size: 34px; line-height: 1; }
  h1 { margin: 10px 0 8px; font-size: 17px; color: #1d1d1f; letter-spacing: .2px; }
  p { margin: 0; font-size: 12.5px; line-height: 1.6; color: #6e6e73; }
  p.sub { color: #1d1d1f; font-weight: 600; margin-top: 8px; }
  .btns { margin-top: auto; display: flex; gap: 8px; justify-content: flex-end; }
  button {
    font: inherit; font-size: 12.5px; padding: 8px 15px; border-radius: 9px;
    border: none; cursor: pointer; transition: background .15s, transform .1s;
  }
  button:active { transform: scale(.97); }
  #later { background: rgba(0, 0, 0, .06); color: #1d1d1f; }
  #later:hover { background: rgba(0, 0, 0, .1); }
  #go { background: #e63b3b; color: #fff; font-weight: 600; }
  #go:hover { background: #d33232; }

  /* ── 深色模式 ── */
  @media (prefers-color-scheme: dark) {
    body {
      background: #141416 !important;
      color: #f5f5f7 !important;
    }
    .card, .sheet { background: #232325 !important; }
    .sub, small, .muted { color: #98989d !important; }
  }
</style>
  <script src="i18n.js"></script>
</head>
<body>
<div id="card">
  <div class="star">⭐</div>
  <h1>喜欢这只小东西吗？</h1>
  <p>1025 只宝可梦、1025 套专属招式、成对的异色版……<br>全部免费开源，没有广告也没有内购。</p>
  <p class="sub">去 GitHub 点个 Star ⭐ 就是最大的支持。</p>
  <div class="btns">
    <button id="later">以后再说</button>
    <button id="go">去点 Star</button>
  </div>
</div>
<script>
  document.getElementById('go').onclick = () => window.star.go();
  document.getElementById('later').onclick = () => window.star.later();
</script>
</body>
</html>
