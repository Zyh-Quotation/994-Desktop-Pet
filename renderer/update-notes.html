<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>更新内容</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --fg: #1c1c1e;
    --muted: #8e8e93;
    --line: rgba(0, 0, 0, .08);
    --accent: #e63b3b;
    --new: #1f9d55;
    --fix: #c77700;
    --shadow: 0 8px 30px rgba(30, 35, 60, .08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--fg);
    background: radial-gradient(circle at 50% 0%, #fffdf5 0%, var(--bg) 52%);
    overflow: hidden;
  }
  .app { height: 100vh; display: flex; flex-direction: column; position: relative; }
  .bar {
    flex: none; height: 38px; display: flex; align-items: center; justify-content: flex-end;
    padding: 0 8px; -webkit-app-region: drag; user-select: none;
  }
  .close {
    width: 30px; height: 30px; border: 0; border-radius: 50%;
    background: transparent; color: var(--muted); font-size: 20px; line-height: 1;
    cursor: pointer; -webkit-app-region: no-drag;
  }
  .close:hover { background: rgba(128, 128, 128, .14); color: var(--fg); }

  .hero { flex: none; padding: 0 28px 12px; text-align: center; }
  .spark { font-size: 36px; line-height: 1.1; filter: drop-shadow(0 5px 10px rgba(230, 59, 59, .18)); }
  .kicker {
    margin: 6px 0 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent);
  }
  h1 { margin: 0; font-size: 21px; line-height: 1.3; letter-spacing: -.3px; }
  .meta { margin-top: 7px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .version {
    display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px;
    background: rgba(230, 59, 59, .1); color: var(--accent); font-size: 11px; font-weight: 700;
  }
  .date, .counts { font-size: 11px; color: var(--muted); }
  .counts:not(:empty)::before { content: '·'; margin-right: 8px; color: var(--line); }

  .scroll { flex: 1; overflow-y: auto; padding: 0 24px 8px; overscroll-behavior: contain; }
  .hint {
    position: static; flex: 0 0 auto; padding: 4px 0 7px;
    text-align: center; font-size: 10.5px; color: var(--muted);
    pointer-events: none; opacity: 0; transition: opacity .18s;
  }
  .hint.show { opacity: 1; }
  .section {
    background: var(--card); border: 1px solid var(--line); border-radius: 13px;
    box-shadow: var(--shadow); padding: 13px 15px 10px; margin-bottom: 11px;
  }
  .section h2 {
    margin: 0 0 7px; font-size: 12px; letter-spacing: .02em; display: flex; align-items: center; gap: 6px;
  }
  .section h2 .icon { font-size: 13px; }
  .section.new h2 { color: var(--new); }
  .section.fix h2 { color: var(--fix); }
  .section.info h2 { color: var(--accent); }
  ul { margin: 0; padding: 0; list-style: none; }
  li { display: flex; gap: 8px; padding: 4px 0; font-size: 12.5px; line-height: 1.55; }
  li .dot {
    flex: none; width: 17px; height: 17px; margin-top: 1px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800;
  }
  .new li .dot { background: rgba(31, 157, 85, .12); color: var(--new); }
  .fix li .dot { background: rgba(199, 119, 0, .12); color: var(--fix); }
  .info li .dot { background: rgba(230, 59, 59, .1); color: var(--accent); }
  li .text { min-width: 0; overflow-wrap: anywhere; }

  .empty { padding: 26px 8px; text-align: center; color: var(--muted); font-size: 12px; }
  .err { min-height: 16px; margin: 0 24px 4px; color: #c0392b; font-size: 11px; text-align: center; }

  footer {
    flex: none; display: flex; gap: 10px; justify-content: flex-end; align-items: center;
    padding: 13px 24px 18px; border-top: 1px solid var(--line);
    background: rgba(255, 255, 255, .72); backdrop-filter: blur(12px);
  }
  button.action {
    border: 0; border-radius: 10px; padding: 10px 19px; font: inherit; font-size: 12.5px;
    font-weight: 600; cursor: pointer; min-width: 104px;
  }
  button.primary { background: var(--accent); color: #fff; box-shadow: 0 5px 14px rgba(230, 59, 59, .22); }
  button.primary:hover { filter: brightness(1.06); }
  button.primary:disabled { opacity: .55; cursor: default; box-shadow: none; }
  button.ghost { background: rgba(128, 128, 128, .1); color: var(--fg); }
  button.ghost:hover { background: rgba(128, 128, 128, .17); }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #2c2c2e; --fg: #f5f5f7; --muted: #98989d;
      --line: rgba(255, 255, 255, .1); --shadow: 0 8px 30px rgba(0, 0, 0, .25);
    }
    body { background: radial-gradient(circle at 50% 0%, #262629 0%, var(--bg) 52%); }
    footer { background: rgba(28, 28, 30, .78); }
  }
</style>
</head>
<body>
  <div class="app" role="dialog" aria-modal="true" aria-labelledby="title">
    <div class="bar"><button class="close" id="close" title="关闭" aria-label="关闭">×</button></div>
    <header class="hero">
      <div class="spark" id="spark">✨</div>
      <p class="kicker" id="kicker">更新内容</p>
      <h1 id="title">更新完成</h1>
      <div class="meta">
        <span class="version" id="version">v0.0.0</span>
        <span class="date" id="date"></span>
        <span class="counts" id="counts"></span>
      </div>
    </header>
    <main class="scroll" id="scroll"></main>
    <div class="hint" id="hint"></div>
    <p class="err" id="err"></p>
    <footer>
      <button class="action ghost" id="later">稍后</button>
      <button class="action primary" id="primary">开始使用</button>
    </footer>
  </div>
  <script src="update-notes.js"></script>
</body>
</html>
